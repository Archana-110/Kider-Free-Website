<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Memory Match</title>
    <style>
        body {
            background: #FFB6C1;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }

        .game-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px;
            max-width: 500px;
        }

        .card {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            background: #98FB98;
            cursor: default;
        }

        .score-board {
            font-size: 24px;
            margin: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            background: #FF69B4;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="score-board">
        Moves: <span id="moves">0</span>
    </div>
    
    <div class="game-container" id="gameBoard"></div>
    
    <button onclick="startGame()">New Game</button>

    <script>
        const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'];
        let flippedCards = [];
        let moves = 0;

        function createBoard() {
            const gameBoard = document.getElementById('gameBoard');
            const doubledEmojis = [...emojis, ...emojis];
            
            // Shuffle emojis
            doubledEmojis.sort(() => Math.random() - 0.5);
            
            gameBoard.innerHTML = '';
            
            doubledEmojis.forEach(emoji => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<span style="display: none">${emoji}</span>`;
                card.addEventListener('click', () => flipCard(card));
                gameBoard.appendChild(card);
            });
        }

        function flipCard(card) {
            if (flippedCards.length < 2 && !card.classList.contains('flipped')) {
                card.classList.add('flipped');
                card.querySelector('span').style.display = 'block';
                flippedCards.push(card);

                if (flippedCards.length === 2) {
                    moves++;
                    document.getElementById('moves').textContent = moves;
                    checkMatch();
                }
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const emoji1 = card1.querySelector('span').textContent;
            const emoji2 = card2.querySelector('span').textContent;

            if (emoji1 === emoji2) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                flippedCards = [];
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    card1.querySelector('span').style.display = 'none';
                    card2.querySelector('span').style.display = 'none';
                    flippedCards = [];
                }, 1000);
            }
        }

        function startGame() {
            moves = 0;
            document.getElementById('moves').textContent = '0';
            createBoard();
        }

        // Start the game when page loads
        startGame();
    </script>
</body>
</html>
